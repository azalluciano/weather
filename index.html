<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="card">
      <div class="search">
        <input type="text" placeholder="enter city name" spellcheck="false" />
        <button><img src="assets/images/search.png" alt="" /></button>
      </div>
      <div class="weather">
        <img src="assets/images/rain.png" alt="" class="weather-icon" />
        <h1 class="temp">22°c</h1>
        <h2 class="city">New York</h2>
        <div class="details">
          <div class="col">
            <img src="assets/images/humidity.png" alt="" />
            <div>
              <p class="humidity">50%</p>
              <p>Humidity</p>
            </div>
          </div>
          <div class="col">
            <img src="assets/images/wind.png" alt="" />
            <div>
              <p class="wind">15 km/h</p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const apiKey = "32d75621e076ce907c105c769fec7c02";
      const apiUrl =
        "https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";
      const searchBox = document.querySelector(".search input");
      const searchBtn = document.querySelector(".search button");

      async function fetchWeather(city) {
        const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
        var data = await response.json();
        console.log(data);

        document.querySelector(".city").innerHTML = data.name;
        document.querySelector(".temp").innerHTML =
          Math.round(data.main.temp) + "°c";
        document.querySelector(".humidity").innerHTML =
          data.main.humidity + "%";
        document.querySelector(".wind").innerHTML = data.wind.speed + "km/h";

        const weatherIcon = document.querySelector(".weather-icon");

        switch (data.weather[0].main) {
          case "Clouds":
            weatherIcon.src = "assets/images/cloud.png";
            break;
          case "Clear":
            weatherIcon.src = "assets/images/clear.png";
            break;
          case "Rain":
            weatherIcon.src = "assets/images/rain.png";
            break;
          case "Drizzle":
            weatherIcon.src = "assets/images/drizzle.png";
            break;
          case "Mist":
            weatherIcon.src = "assets/images/mist.png";
            break;
          default:
            weatherIcon.src = "assets/images/clear.png";
        }
      }
      document.addEventListener("DOMContentLoaded", () => {
        // Appeler fetchWeather avec une ville par défaut
        fetchWeather("New York");
      });
      searchBtn.addEventListener("click", () => {
        fetchWeather(searchBox.value);
      });
    </script>
  </body>
</html>
